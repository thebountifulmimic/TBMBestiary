<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TBM Bestiary</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1em;
      max-width: 2000px;
    }

    .nav-buttons a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #fff;
      background-color: #492468;
      border: none;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .nav-buttons a:hover {
      background-color: #6a359c;
    }

    .nav-buttons img {
      width: 24px;
      height: 24px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <h1>TBM Bestiary</h1>

		<div class="nav-buttons" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1em; max-width: 400px;">
	  <!-- Left-aligned link -->
	  <a class="nav-link" href="/initiative">Initiative Tracker</a>

	  <!-- Right-aligned home button -->
	  <a class="nav-link" href="/">
		<img src="images/homeicon.png" alt="Home">
	  </a>
	</div>


    <!-- =========================
         Search Bar
         ========================= -->
    <input type="text" id="search" placeholder="Search monsters...">

    <!-- =========================
         Type Filters
         ========================= -->
    <nav id="creature-types" class="filter-bar"></nav>

    <!-- =========================
         Source Filters
         ========================= -->
    <nav id="source-filters" class="filter-bar"></nav>

    <!-- =========================
         CR Filters
         ========================= -->
    <nav id="cr-filters" class="filter-bar"></nav>

    <!-- =========================
         Monster List
         ========================= -->
    <div id="monster-list"></div>

  </div>

  <script src="js/index.js"></script>
</body>
</html>
