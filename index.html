<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TBM Project Landing</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Reset basic styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .landing-wrapper {
      text-align: center;
      max-width: 900px;
      padding: 2rem;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .logo {
      width: 120px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #222;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #555;
    }

    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .landing-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #007acc;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      text-decoration: none;
      transition: all 0.3s ease;
      width: 180px;
    }

    .landing-button img {
      width: 50px;
      height: 50px;
      margin-bottom: 0.5rem;
    }

    .landing-button:hover {
      background: #005fa3;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    @media (max-width: 600px) {
      .buttons-container {
        flex-direction: column;
        gap: 1rem;
      }
      .landing-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="landing-wrapper">
    <img class="logo" src="images/TBMLogo.png" alt="TBM Logo">
    <h1>Welcome to TBM Project</h1>
    <p>Explore our tools, resources, and interactive modules for managing your tabletop adventures.</p>

    <div class="buttons-container">
      <a class="landing-button" href="bestiary.html">
        <img src="images/bestiary-icon.png" alt="Bestiary">
        Bestiary
      </a>
      <a class="landing-button" href="initiative.html">
        <img src="images/initiative-icon.png" alt="Initiative Tracker">
        Initiative Tracker
      </a>
      <a class="landing-button" href="index.html">
        <img src="images/home.png" alt="Home">
        Home
      </a>
    </div>
  </div>

</body>
</html>
