<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TBM Project Landing</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Landing page specific styles */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: url("https://i.imgur.com/8XflKRc.png"); /* keeps your background */
      background-attachment: fixed;
      background-size: cover;
    }

    .landing-wrapper {
      text-align: center;
      max-width: 900px;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .landing-wrapper .logo {
      width: 120px;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'AlmendraSC', Georgia, serif;
      font-weight: 700;
      color: #492468;
      margin-bottom: 0.5rem;
      font-size: 2.5rem;
    }

    p {
      font-family: 'Bookmania', Georgia, serif;
      color: #2c2c2c;
      margin-bottom: 2rem;
      font-size: 1.2rem;
    }

    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .buttons-container button {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 10px 20px;
      font-size: 1rem;
    }

    .buttons-container img {
      width: 24px;
      height: 24px;
    }

    @media (max-width: 600px) {
      .buttons-container {
        flex-direction: column;
        gap: 1rem;
      }
      .buttons-container button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="landing-wrapper">
    <img class="logo" src="images/TBMLogo.png" alt="TBM Logo">
    <h1>Welcome to TBM Project</h1>
    <p>Explore our tools, resources, and interactive modules for managing your tabletop adventures.</p>

    <div class="buttons-container">
      <button>
        <a class="nav-link" href="bestiary.html">
          <img src="images/bestiary-icon.png" alt="Bestiary"> Bestiary
        </a>
      </button>

      <button>
        <a class="nav-link" href="initiative.html">
          <img src="images/initiative-icon.png" alt="Initiative Tracker"> Initiative Tracker
        </a>
      </button>

      <button>
        <a class="nav-link" href="index.html">
          <img src="images/home.png" alt="Home"> Home
        </a>
      </button>
    </div>
  </div>
</body>
</html>
